name: Publish image to GHCR

# Fork-owned. Builds the repo-root Dockerfile and pushes it to GHCR, where the
# relay VPS pulls it from. The verify job repeats upstream's ci.yml because
# ci.yml does not run on tag pushes and cannot be called from here unedited.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Queued, not cancelled, so an older commit never overwrites a newer `main` tag.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: 29.0.2
          elixir-version: 1.20.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/ci.sh

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/getrambla/rambla-relay
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/getrambla/rambla-relay

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
